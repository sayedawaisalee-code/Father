<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For My Papa ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
overflow:hidden;
color:white;
}

.container{
text-align:center;
animation: fadeIn 2s ease-in-out;
}

h1{
font-size:3rem;
color:#ff4d6d;
animation: glow 2s infinite alternate;
}

p{
margin-top:15px;
font-size:1.2rem;
color:#ddd;
line-height:1.6;
max-width:600px;
}

.heart{
font-size:50px;
animation: beat 1s infinite;
color:red;
margin-top:20px;
}

button{
margin-top:25px;
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:16px;
cursor:pointer;
animation: pulse 2s infinite;
}

button:hover{
background:#ff1e4d;
}

#message{
margin-top:20px;
font-size:1.1rem;
color:#fff;
min-height:40px;
}

/* animations */
@keyframes fadeIn{
from{opacity:0; transform:translateY(-20px)}
to{opacity:1; transform:translateY(0)}
}

@keyframes glow{
from{text-shadow:0 0 10px #ff4d6d;}
to{text-shadow:0 0 25px #ff1e4d;}
}

@keyframes beat{
0%,100%{transform:scale(1)}
50%{transform:scale(1.3)}
}

@keyframes pulse{
0%{box-shadow:0 0 10px #ff4d6d;}
50%{box-shadow:0 0 25px #ff1e4d;}
100%{box-shadow:0 0 10px #ff4d6d;}
}

/* floating hearts */
.heart-float{
position:absolute;
color:pink;
animation: floatUp 6s linear infinite;
opacity:0.7;
}

@keyframes floatUp{
0%{transform:translateY(100vh) scale(0.5); opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-10vh) scale(1.2); opacity:0;}
}

</style>
</head>
<body>

<div class="container">
<h1>❤️ I Love You Papa ❤️</h1>
<p>
<b>Dad, you are the strongest pillar of my life. 
Every sacrifice you make gives me the strength to move forward. I am proud to be your son. 
I love you ❤️</b>
</p>

<div class="heart">❤️</div>

<button onclick="showMessage()">Click Me</button>

<div id="message"></div>
</div>

<script>
function showMessage(){
const msg = document.getElementById('message');
msg.innerHTML = "Dad ❤️ I will always be your pride. Thank you for everything!";
}

// floating hearts
function createHeart(){
const heart = document.createElement('div');
heart.classList.add('heart-float');
heart.innerHTML = '❤️';
heart.style.left = Math.random()*100 + 'vw';
heart.style.fontSize = (Math.random()*20 + 10) + 'px';
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
